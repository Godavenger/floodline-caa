name: Verify Floodline

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'data/**'
      - '.github/workflows/**'
      - 'start.*'
      - 'Dockerfile'
      - 'compose.yaml'
      - '.env.example'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify backend acceptance
        run: python scripts/verify_backend.py
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build and verify Light and Dark workflows
        run: npm test --prefix frontend
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floodline-acceptance
          include-hidden-files: true
          path: |
            outputs/evidence/backend-acceptance.json
            outputs/evidence/backend-tests.txt
            .verification/browser-acceptance.json
            .verification/runs/**/failure.png
            .impeccable/review/*.png
